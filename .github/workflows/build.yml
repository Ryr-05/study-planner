name: Build APK

# Every push to main builds a signed APK and publishes it as the newest Release,
# so the "Download APK" button in the README always gets the latest version.
# Pushes to dev/** branches build and test but do not publish a release.
# Pull requests only build (no signing, no release) to check that the code compiles.
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Load signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Add Firebase config
        if: github.event_name != 'pull_request'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            echo "Firebase config added: cloud sync is on in this build."
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest -Proborazzi.test.verify=false

      - name: Render screenshots (normal and large text)
        run: ./gradlew recordRoborazziDebug --tests '*ScreenshotTest*'

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/

      - name: Print database schema
        # Room's own CREATE statements, to check hand-written migrations against.
        run: grep -rhoE 'CREATE (TABLE|INDEX) IF NOT EXISTS [^"]*' app/build/generated/ksp/debug | sort -u || true

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release*.apk Noctil.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Noctil-apk
          path: Noctil.apk

      - name: Publish as latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" Noctil.apk \
            --title "Noctil $VERSION_NAME" \
            --notes "$(git log -1 --pretty=%B)" \
            --target "$GITHUB_SHA" \
            --latest
